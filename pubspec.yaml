name: lumen_reader
description: "Lumen Reader — a PDF reader that reads aloud with Kokoro neural speech."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # PDF rendering + structured text extraction (pdfium under the hood).
  pdfrx: ^2.6.5

  # Audio playback with pitch-corrected rate control on Windows.
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9

  file_picker: ^13.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  window_manager: ^0.5.2
  google_fonts: ^8.2.1
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/python/
